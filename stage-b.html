<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troll Toll · Stage B visual prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#141833;overflow:hidden;font-family:Fredoka,system-ui,sans-serif}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  svg,#grey{position:absolute;inset:0;width:100%;height:100%}
  #grey{object-fit:cover;display:none}
  #bar{position:fixed;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:6px;z-index:5;opacity:.25;transition:opacity .2s}
  #bar:hover{opacity:1}
  #bar button{font:600 13px Fredoka,system-ui;border:0;border-radius:999px;padding:7px 13px;background:#fff;color:#1b1f5e;cursor:pointer}
  #bar button.on{background:#ffc61a}
  .noanim *{animation-play-state:paused!important}
  @keyframes lava{to{stroke-dashoffset:-120}}
  @keyframes glow{50%{opacity:.55}}
  @keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.85}100%{transform:translate(var(--dx),-170px) scale(1.9);opacity:0}}
  @keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-120px);opacity:0}}
  @keyframes flag{50%{transform:skewY(-9deg) scaleX(.86)}}
  @keyframes bob{50%{transform:translateY(-3px)}}
  @keyframes drift{to{transform:translateX(90px)}}
  @keyframes fall{to{stroke-dashoffset:-60}}
  @keyframes flick{50%{transform:scaleY(.8) translateY(2px)}}
  @keyframes spark{0%,100%{opacity:.3}50%{opacity:1}}
  .lava{stroke-dasharray:26 14;animation:lava 3.2s linear infinite}
  .glow{animation:glow 2.4s ease-in-out infinite}
  .smoke{transform-box:fill-box;transform-origin:center;animation:smoke 7s linear infinite}
  .ember{animation:ember 3.5s linear infinite}
  .flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite}
  .bob{animation:bob 2.2s ease-in-out infinite}
  .drift{animation:drift 60s linear infinite alternate}
  .fall{stroke-dasharray:14 10;animation:fall 1s linear infinite}
  .flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite}
  .crack{animation:spark 2.8s ease-in-out infinite}
</style></head><body>

function drawRoad(C, types, bridgeAt) {
  const L = C[C.length - 1][2], n = Math.max(1, Math.round(L / TL)), tl = L / n, D = pathD(C);
  add(`<path d="${D}" stroke="#000" stroke-opacity=".16" stroke-width="${hwRoad * 2 + 10}" fill="none" stroke-linecap="round" transform="translate(0 4)"/>`);
  add(`<path d="${D}" stroke="#5b4532" stroke-width="${hwRoad * 2 + 8}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  add(`<path d="${D}" stroke="#b9925f" stroke-width="${hwRoad * 2 + 3}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
  const out = [];
  for (let i = 0; i < n; i++) {
    const s0 = i * tl + GAP / 2, s1 = (i + 1) * tl - GAP / 2, k = 0.86, P = [], steps = 4;
    for (let j = 0; j <= steps; j++) { const p = at(C, s0 + (s1 - s0) * j / steps); P.push([p.x + p.nx * hwRoad * k, p.y + p.ny * hwRoad * k]); }
    for (let j = steps; j >= 0; j--) { const p = at(C, s0 + (s1 - s0) * j / steps); P.push([p.x - p.nx * hwRoad * k, p.y - p.ny * hwRoad * k]); }
    const m = at(C, (s0 + s1) / 2), a = ash(m.x), t = types[i] || 'road', isBr = bridgeAt === i;
    const base = isBr ? '#9a6a3e' : a > 0.6 ? '#4d3d38' : a > 0.25 ? '#c9b48e' : ['#efe3c9', '#eadcbf', '#f3e9d3'][i % 3];
    out.push(`<polygon points="${pts(P.map(p => [p[0], p[1] + 2.5]))}" fill="#000" opacity=".22" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-opacity=".22"/>`);
    out.push(`<polygon points="${pts(P)}" fill="${base}" stroke="${base}" stroke-width="1.5" stroke-linejoin="round"/>`);
    out.push(`<polyline points="${pts(P.slice(0, steps + 1))}" fill="none" stroke="#fff" stroke-opacity="${a > .6 ? .12 : .5}" stroke-width="1.6"/>`);
    if (isBr) for (let j = 1; j < 4; j++) { const p = at(C, s0 + (s1 - s0) * j / 4); out.push(`<line x1="${f1(p.x + p.nx * hwRoad * .8)}" y1="${f1(p.y + p.ny * hwRoad * .8)}" x2="${f1(p.x - p.nx * hwRoad * .8)}" y2="${f1(p.y - p.ny * hwRoad * .8)}" stroke="#6b4630" stroke-width="1.6"/>`); }
    if (a > 0.6 && !isBr) out.push(`<path d="M${f1(m.x - 6)} ${f1(m.y - 3)} l5 3 l-2 4 l6 2" stroke="#ff8a2a" stroke-width="1.6" fill="none" class="crack" style="animation-delay:${-i * .4}s"/>`);
    if (INLAY[t]) out.push(`<g transform="translate(${f1(m.x)} ${f1(m.y)})"><ellipse rx="11.5" ry="9" fill="${INLAY[t]}" stroke="${INK}" stroke-width="1.8"/><ellipse rx="8.6" ry="6.4" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/>${GLYPH[t]}</g>`);
  }
  add(out.join(''));
}
