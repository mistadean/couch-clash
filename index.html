<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<title>Couch Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#14112b;color:#fff;font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0}
#tv{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;
  background:radial-gradient(circle at 30% 20%,#3a2a7a 0,#14112b 60%)}
#menu h1{font-size:clamp(44px,9vw,96px);letter-spacing:2px;line-height:1;text-align:center;
  background:linear-gradient(90deg,#ff5a6e,#ffcc33,#56e07a,#38c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
#menu p{opacity:.75;text-align:center;max-width:520px;font-size:18px}
.mbtns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.mbtn{min-width:240px;padding:22px 26px;border-radius:22px;font-size:24px;font-weight:700;color:#14112b;box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .08s}
.mbtn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.mbtn small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:4px}
.mbtn.tv{background:#ffcc33}.mbtn.phone{background:#38c6ff}

/* ---------- phone controller ---------- */
#pad{position:fixed;inset:0;display:flex;flex-direction:column;background:#1b1838;user-select:none;-webkit-user-select:none;touch-action:none}
#padTop{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(0,0,0,.3);min-height:54px}
#chip{width:30px;height:30px;border-radius:50%;background:#888;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
#pname{font-weight:700;font-size:18px;flex:none}
#phint{flex:1;font-size:14px;opacity:.85;text-align:right;line-height:1.2}
#padBody{flex:1;position:relative;display:flex}
#stickZone{flex:1.1;position:relative;touch-action:none}
#btnZone{flex:1;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
#stickBase{position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);
  transform:translate(-50%,-50%);pointer-events:none}
#stickKnob{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.85);transform:translate(-50%,-50%);pointer-events:none;
  box-shadow:0 6px 0 rgba(0,0,0,.3)}
#stickHelp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.35;font-size:15px;text-align:center;pointer-events:none}
#aBtn{width:min(42vw,42vh,190px);height:min(42vw,42vh,190px);border-radius:50%;font-size:clamp(20px,5vw,30px);font-weight:700;color:#14112b;
  box-shadow:0 10px 0 rgba(0,0,0,.35),inset 0 -10px 0 rgba(0,0,0,.15);background:#ffcc33;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#aBtn small{font-size:.5em;opacity:.7;margin-top:4px}
#aBtn.down{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.15)}
#padMsg{pointer-events:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(92%,520px);background:rgba(10,8,30,.82);border-radius:18px;padding:14px 18px;text-align:center;font-size:16px;line-height:1.35;z-index:3}
#padMsg b{display:block;font-size:22px;margin-bottom:4px}
#startBtn{pointer-events:auto;margin-top:10px;padding:12px 26px;border-radius:14px;font-size:20px;font-weight:700;background:#56e07a;color:#14112b;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#rotate{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:13px;opacity:.5;pointer-events:none}
@media (orientation:landscape){#rotate{display:none}}

#joinForm{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(circle at 50% 10%,#2b4a8a 0,#14112b 70%);z-index:5}
#joinForm h2{font-size:34px}
#joinForm input{width:min(320px,86vw);padding:16px;border-radius:14px;border:0;font-size:24px;font-family:inherit;text-align:center;background:#fff;color:#14112b}
#codeIn{letter-spacing:10px;text-transform:uppercase;font-weight:700}
#joinGo{width:min(320px,86vw);padding:16px;border-radius:14px;font-size:24px;font-weight:700;background:#56e07a;color:#14112b;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#joinErr{color:#ff8a98;min-height:22px;text-align:center;max-width:340px}
#netBanner{position:fixed;left:0;right:0;bottom:0;background:#ff5a6e;color:#fff;text-align:center;padding:6px;font-size:14px;z-index:6}
</style>
</head>
<body>

<div id="menu">
  <h1>COUCH CLASH</h1>
  <p>Arcade party games for 2–4 players. The TV is the console, phones are the controllers.</p>
  <div class="mbtns">
    <button class="mbtn tv" id="hostBtn">📺 Host on this screen<small>Open on the TV or laptop</small></button>
    <button class="mbtn phone" id="joinBtn">📱 Join as controller<small>Open on your phone</small></button>
  </div>
  <p style="font-size:14px;opacity:.5">No phones handy? Host, then join with the keyboard (WASD + Space, Arrows + Enter).</p>
</div>

<canvas id="tv" class="hidden"></canvas>

<div id="pad" class="hidden">
  <div id="padTop"><div id="chip"></div><div id="pname">Player</div><div id="phint">Connecting…</div></div>
  <div id="padBody">
    <div id="stickZone"><div id="stickHelp">Drag anywhere here<br>to move</div><div id="stickBase" class="hidden"></div><div id="stickKnob" class="hidden"></div></div>
    <div id="btnZone"><button id="aBtn">A<small>ACTION</small></button></div>
    <div id="padMsg" class="hidden"></div>
  </div>
  <div id="rotate">Tip: turn your phone sideways ↻</div>
  <div id="joinForm">
    <h2>Join a game</h2>
    <input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <input id="nameIn" maxlength="10" placeholder="Your name" autocomplete="off">
    <button id="joinGo">Join</button>
    <div id="joinErr"></div>
  </div>
</div>
<div id="netBanner" class="hidden"></div>

/* =====================================================================
   GAME 1: GOAL GUARD
   Four goals around a square arena. Slide along your side, block balls,
   tap A to WHACK them back faster. Out of lives = your goal becomes a wall.
   ===================================================================== */
const GoalGuard = {
  title: 'Goal Guard', accent: '#38c6ff', button: 'WHACK',
  how: 'Slide along your side and keep the balls out of your goal. Tap A to WHACK a ball back extra fast. Last one standing wins!',
  create(players) {
    const cx = 640, cy = 374, h = 282, C = 70, LIVES = 8, PAD = 46;
    const g = { t: 0, limit: 105, balls: [], spawnT: 1.0, elim: [], done: false, qs: [] };
    for (const p of players) g.qs.push({ p, side: p.slot, u: 0, lunge: 0, cd: 0, lives: LIVES, out: false, flash: 0, err: 0, errBall: null, hitT: 0 });
    const q4 = s => g.qs.find(q => q.side === s);
    const isWall = s => { const q = q4(s); return !q || q.out; };
    const axis = s => s < 2 ? [1, 0] : [0, 1];               // direction along the side
    const inward = s => [[0, -1], [0, 1], [1, 0], [-1, 0]][s]; // towards the arena centre
    const umax = h - C - PAD + 12;
    function padPos(q) {
      const L = q.lunge > 0 ? Math.sin((1 - q.lunge / 0.2) * Math.PI) * 30 : 0;
      const [ix, iy] = inward(q.side), [ax, ay] = axis(q.side), base = h - 30;
      return [cx - ix * base + ax * q.u + ix * L, cy - iy * base + ay * q.u + iy * L];
    }
    function spawnBall() {
      const alive = g.qs.filter(q => !q.out); if (!alive.length) return;
      const tq = alive[Math.floor(Math.random() * alive.length)];
      const [ix, iy] = inward(tq.side), a = Math.atan2(-iy, -ix) + rand(-0.55, 0.55), sp = 300 + g.t * 2.2;
      g.balls.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, born: 0.7, last: -1, trail: [] });
    }
    function fixAngle(b) { // avoid near-parallel balls that never reach a goal
      const sp = hyp(b.vx, b.vy), mn = sp * 0.28;
      if (Math.abs(b.vx) < mn) b.vx = (b.vx < 0 ? -1 : 1) * mn;
      if (Math.abs(b.vy) < mn) b.vy = (b.vy < 0 ? -1 : 1) * mn;
      const s2 = hyp(b.vx, b.vy); b.vx *= sp / s2; b.vy *= sp / s2;
    }
    function goal(q, b) {
      q.lives--; q.flash = 0.6; shake(0.5); SFX.goal(); buzz(q.p, 250);
      const [ix, iy] = inward(q.side); burst(b.x - ix * 10, b.y - iy * 10, q.p.color, 30, 420, 8, 0.8);
      if (q.lives <= 0) { q.out = true; g.elim.push(q.p.slot); SFX.out(); shake(1); toast(q.p.name + ' is OUT!'); }
    }
    g.update = dt => {
      g.t += dt;
      for (const q of g.qs) {
        q.flash = Math.max(0, q.flash - dt); q.hitT = Math.max(0, q.hitT - dt);
        if (q.out) continue;
        const inp = q.p.input, mv = q.side < 2 ? inp.x : inp.y;
        q.u = clamp(q.u + mv * 600 * dt, -umax, umax);
        q.cd -= dt; q.lunge = Math.max(0, q.lunge - dt);
        if (q.p.aDown && q.cd <= 0) { q.lunge = 0.2; q.cd = 0.45; SFX.dash(); }
      }
      const maxBalls = g.t < 18 ? 2 : g.t < 45 ? 3 : 4;
      if (g.balls.length < maxBalls) { g.spawnT -= dt; if (g.spawnT <= 0) { spawnBall(); g.spawnT = 1.3; } }
      for (let i = g.balls.length - 1; i >= 0; i--) {
        const b = g.balls[i];
        if (b.born > 0) { b.born -= dt; continue; }
        b.trail.push([b.x, b.y]); if (b.trail.length > 8) b.trail.shift();
        // sub-step for fast balls
        const steps = Math.ceil(hyp(b.vx, b.vy) * dt / 10);
        let scored = false;
        for (let s = 0; s < steps && !scored; s++) {
          const sdt = dt / steps; b.x += b.vx * sdt; b.y += b.vy * sdt;
          // corner blocks
          for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
            const x0 = sx < 0 ? cx - h : cx + h - C, y0 = sy < 0 ? cy - h : cy + h - C;
            const nx = clamp(b.x, x0, x0 + C), ny = clamp(b.y, y0, y0 + C);
            const dx = b.x - nx, dy = b.y - ny, d = hyp(dx, dy);
            if (d < 12) {
              let mx, my;
              if (d > 0.001) { mx = dx / d; my = dy / d; } else { mx = -sx; my = 0; }
              b.x = nx + mx * 12; b.y = ny + my * 12;
              const vn = b.vx * mx + b.vy * my; if (vn < 0) { b.vx -= 2 * vn * mx; b.vy -= 2 * vn * my; fixAngle(b); SFX.hit(); }
            }
          }
          // paddles (capsules)
          for (const q of g.qs) {
            if (q.out) continue;
            const [px, py] = padPos(q), [ax, ay] = axis(q.side), half = PAD;
            const t = clamp((b.x - px) * ax + (b.y - py) * ay, -half, half);
            const qx = px + ax * t, qy = py + ay * t, dx = b.x - qx, dy = b.y - qy, d = hyp(dx, dy), R = 12 + 13;
            if (d < R && d > 0.001) {
              const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
              b.x = qx + nx * R; b.y = qy + ny * R;
              if (vn < 0) {
                b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
                const [ix, iy] = inward(q.side);
                // add english from paddle offset, always send it inward
                b.vx += ax * t * 4; b.vy += ay * t * 4;
                let sp = hyp(b.vx, b.vy);
                if (b.vx * ix + b.vy * iy < sp * 0.35) { b.vx += ix * sp * 0.5; b.vy += iy * sp * 0.5; }
                let target = Math.min(sp * 1.04, 820);
                if (q.lunge > 0) { target = Math.min(sp * 1.45, 1050); SFX.whack(); shake(0.25); burst(b.x, b.y, '#fff', 12, 300, 5, 0.4); }
                else SFX.hit();

                b.last = q.p.slot; q.hitT = 0.15; buzz(q.p, 30);
              }
            }
          }
          // walls / goals
          // side indices: 0 bottom, 1 top, 2 left, 3 right
          for (const [side, edge, ax, dir] of [[0, cy + h, 'y', 1], [1, cy - h, 'y', -1], [2, cx - h, 'x', -1], [3, cx + h, 'x', 1]]) {

            if (isWall(side)) {

            } else if ((pos - edge) * dir > 14) {
              goal(q4(side), b); g.balls.splice(i, 1); scored = true; break;
            }
          }
        }
      }
      const alive = g.qs.filter(q => !q.out);
      if (alive.length <= 1 || g.t >= g.limit) g.done = true;
    };
    g.ranking = () => {
      const alive = g.qs.filter(q => !q.out).sort((a, b) => b.lives - a.lives).map(q => q.p.slot);
      return [...alive, ...g.elim.slice().reverse()];
    };
    g.bot = (p, dt) => {
      const q = g.qs.find(z => z.p === p);
      if (q.out) { p.input = { x: 0, y: 0, a: false }; return; }
      const [ix, iy] = inward(q.side), [ax, ay] = axis(q.side), base = h - 30;
      const gx = cx - ix * base, gy = cy - iy * base; // paddle line point
      let best = null, bt = 1e9;
      for (const b of g.balls) {
        if (b.born > 0) continue;
        const toward = -(b.vx * ix + b.vy * iy); if (toward <= 0) continue;
        const dist = (b.x - gx) * ix + (b.y - gy) * iy; if (dist < -20) continue;
        const tt = dist / toward; if (tt > 2.2) continue;

/* =====================================================================

const IceSumo = {

    const starts = [[1, 1], [COLS - 2, ROWS - 2], [COLS - 2, 1], [1, ROWS - 2]];

      const [c, r] = starts[p.slot];

        g.pwT = rand(5, 8);
      }
      for (const pw of g.pw) pw.t += dt;
      for (const q of g.qs) {
        q.cd -= dt; q.dashT = Math.max(0, q.dashT - dt); q.stun = Math.max(0, q.stun - dt); q.frozen = Math.max(0, q.frozen - dt); q.rush = Math.max(0, q.rush - dt);

        const canMove = q.stun <= 0 && q.frozen <= 0;
        if (m > 0.2) { q.fx = inp.x / m; q.fy = inp.y / m; }
        if (canMove && q.p.aDown && q.cd <= 0) { q.dashT = 0.3; q.cd = 1.4; SFX.dash(); burst(q.x, q.y, q.p.color, 8, 150, 4, 0.3); }

        for (let i = g.pw.length - 1; i >= 0; i--) { const pw = g.pw[i]; if (hyp(pw.x - q.x, pw.y - q.y) < 38) { g.pw.splice(i, 1); applyPower(q, pw.type); } }
      }
      for (let i = 0; i < g.qs.length; i++) for (let j = i + 1; j < g.qs.length; j++) {
        const a = g.qs[i], b = g.qs[j], dx = b.x - a.x, dy = b.y - a.y, d = hyp(dx, dy), R = a.r + b.r;
        if (d >= R || d < 0.001) continue;
        const nx = dx / d, ny = dy / d, ov = (R - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        let big = false;
        if (a.dashT > 0 && b.stun <= 0) { b.stun = 0.9; b.kx += nx * 520; b.ky += ny * 520; big = true; buzz(b.p, 200); }
        if (b.dashT > 0 && a.stun <= 0) { a.stun = 0.9; a.kx -= nx * 520; a.ky -= ny * 520; big = true; buzz(a.p, 200); }
        if (big) { SFX.bonk(); shake(0.35); burst((a.x + b.x) / 2, (a.y + b.y) / 2, '#ffffff', 14, 280, 5, 0.4); a.dashT = b.dashT = 0; }

    g.bot = (p, dt) => {
      const q = g.qs.find(z => z.p === p);
      q.think -= dt;
      const reached = hyp(q.tx - q.x, q.ty - q.y) < 14;
      if (q.think <= 0 || reached || !q.tx) {
        q.think = rand(0.5, 0.9);
        const leader = g.ranking()[0];
        let best = -1e9, bx = q.x, by = q.y;
        const c0 = Math.floor((q.x - OX) / TS), r0 = Math.floor((q.y - OY) / TS);
        for (let k = 0; k < 46; k++) {
          const local = k < 36;
          const c = local ? clamp(c0 + Math.floor(rand(-5, 6)), 0, COLS - 1) : Math.floor(rand(0, COLS));
          const r = local ? clamp(r0 + Math.floor(rand(-4, 5)), 0, ROWS - 1) : Math.floor(rand(0, ROWS));
          const own = g.tiles[r * COLS + c];
          const x = OX + (c + 0.5) * TS, y = OY + (r + 0.5) * TS, d = hyp(x - q.x, y - q.y) / TS;
          // value nearby unpainted / enemy tiles, count neighbours too
          let val = 0;
          for (let rr2 = r - 1; rr2 <= r + 1; rr2++) for (let cc = c - 1; cc <= c + 1; cc++) {
            if (cc < 0 || rr2 < 0 || cc >= COLS || rr2 >= ROWS) continue;
            const o = g.tiles[rr2 * COLS + cc]; if (o !== p.slot) val += o === leader && leader !== p.slot ? 1.4 : 1;
          }
          const s = val - d * 0.9 + (own === p.slot ? -3 : 0) + rand(0, 1);
          if (s > best) { best = s; bx = x; by = y; }
        }
        for (const pw of g.pw) if (hyp(pw.x - q.x, pw.y - q.y) < 280) { bx = pw.x; by = pw.y; }
        q.tx = bx; q.ty = by;
      }
      const dx = q.tx - q.x, dy = q.ty - q.y, d = hyp(dx, dy) || 1;
      let a = false;
      // dash at nearby rivals sometimes, or randomly while travelling
      for (const o of g.qs) if (o !== q && o.stun <= 0 && hyp(o.x - q.x, o.y - q.y) < 110 && Math.random() < dt * 2.5) { a = true; q.tx = o.x; q.ty = o.y; }
      if (d > 150 && Math.random() < dt * 0.8) a = true;
      p.input = { x: dx / d, y: dy / d, a: a && q.cd <= 0 };
    };
    g.draw = () => {
      bgGradient('#2d1c4f', '#140d26');
      rr(OX - 14, OY - 14, COLS * TS + 28, ROWS * TS + 28, 20); ctx.fillStyle = '#0d0a1f'; ctx.fill();
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const i = r * COLS + c, o = g.tiles[i], x = OX + c * TS, y = OY + r * TS;
        const pop = g.pop[i] > 0 ? g.pop[i] / 0.3 : 0;
        ctx.fillStyle = o >= 0 ? DARKS[o] : (r + c) % 2 ? '#3a3360' : '#332c57';
        ctx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
        if (o >= 0) { const ins = 4 - pop * 4; ctx.fillStyle = COLORS[o]; ctx.fillRect(x + ins, y + ins, TS - ins * 2, TS - ins * 2 - 5); }
      }
      // power-ups
      for (const pw of g.pw) {
        const bob = Math.sin(pw.t * 5) * 5, x = pw.x, y = pw.y + bob, s = Math.min(1, pw.t * 3);
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 26 - bob, 18, 6, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill();
        if (pw.type === 'bomb') {
          ctx.fillStyle = '#14112b'; ctx.beginPath(); ctx.arc(0, 3, 13, 0, 7); ctx.fill();
          ctx.strokeStyle = '#ff5a6e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(5, -8); ctx.quadraticCurveTo(10, -16, 6, -18); ctx.stroke();
          ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(6, -18, 3 + Math.random() * 2, 0, 7); ctx.fill();
        } else if (pw.type === 'freeze') {
          ctx.strokeStyle = '#38c6ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
          for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.lineTo(-Math.cos(a) * 13, -Math.sin(a) * 13); ctx.stroke(); }
        } else {
          ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.moveTo(4, -15); ctx.lineTo(-8, 3); ctx.lineTo(0, 3); ctx.lineTo(-4, 15); ctx.lineTo(8, -3); ctx.lineTo(0, -3); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      const order = g.qs.slice().sort((a, b) => a.y - b.y);
      for (const q of order) {
        if (q.dashT > 0) { for (let k = 1; k <= 3; k++) drawCritter(q.x - q.vx * 0.02 * k, q.y - q.vy * 0.02 * k, q.r, q.p.slot, { alpha: 0.18, noShadow: true }); }
        const run = hyp(q.vx, q.vy) > 30 ? Math.sin(g.t * 22) * 0.07 : 0;
        drawCritter(q.x, q.y - (run ? Math.abs(run) * 40 : 0), q.r, q.p.slot, { fx: q.fx, fy: q.fy, squash: run, dizzy: q.stun > 0, ouch: q.stun > 0 });
        if (q.frozen > 0) { rr(q.x - 28, q.y - 32, 56, 60, 10); ctx.fillStyle = 'rgba(180,235,255,.55)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
        if (q.rush > 0) { ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 8 + Math.sin(g.t * 20) * 2, 0, 7); ctx.stroke(); }
      }
      // score bar
      const total = COLS * ROWS, bw = 800, bx = 100, by = 22;
      rr(bx - 6, by - 6, bw + 12, 44, 22); ctx.fillStyle = 'rgba(10,6,30,.75)'; ctx.fill();
      let x = bx;
      for (const q of g.qs) {
        const w = bw * g.counts[q.p.slot] / total;
        if (w > 0) { ctx.fillStyle = q.p.color; ctx.fillRect(x, by, w, 32); if (w > 46) text(String(g.counts[q.p.slot]), x + w / 2, by + 17, 18, '#14112b'); x += w; }
      }
      timerBadge(g.limit - g.t, 1060);
      g.qs.forEach((q, i) => nameTag(q.p, q.x, q.y - q.r - 24));
    };
    return g;
  },
};

const GAMES = { goal: GoalGuard, sumo: IceSumo, tile: TileTakeover };
window.CC = { host, ctl: null }; // handle for debugging in the browser console

/* =====================================================================
   PHONE CONTROLLER
   ===================================================================== */
const ctl = window.__ctl = { peer: null, conn: null, code: '', name: '', pid: '', joined: false, input: { x: 0, y: 0, a: false }, lastSent: '', lastT: 0, info: null, retry: null };
function startController(code) {
  $('#menu').classList.add('hidden'); $('#pad').classList.remove('hidden');
  ctl.pid = lsGet('cc_pid') || ('p' + Math.random().toString(36).slice(2, 10)); lsSet('cc_pid', ctl.pid);
  $('#codeIn').value = code || lsGet('cc_code') || '';
  $('#nameIn').value = lsGet('cc_name') || '';
  $('#codeIn').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });
  $('#joinGo').onclick = () => {
    const c = $('#codeIn').value.trim().toUpperCase(), n = cleanName($('#nameIn').value);
    if (c.length !== 4) { $('#joinErr').textContent = 'Enter the 4-letter room code from the TV.'; return; }
    if (!n) { $('#joinErr').textContent = 'Pick a name (up to 10 letters).'; return; }
    lsSet('cc_name', n); lsSet('cc_code', c);
    ctl.code = c; ctl.name = n; ctlConnect();
  };
  if (code) setTimeout(() => $('#nameIn').focus(), 200);
  setupPadInput();
  setInterval(ctlSendInput, 33);
}
function ctlConnect() {
  $('#joinErr').textContent = 'Connecting…'; $('#joinGo').disabled = true;
  if (!window.Peer) { $('#joinErr').textContent = 'Networking library failed to load.'; $('#joinGo').disabled = false; return; }
  const open = () => {
    const conn = ctl.peer.connect(PEER_PREFIX + ctl.code.toLowerCase(), { serialization: 'json', reliable: true });
    ctl.conn = conn;
    conn.on('open', () => { conn.send({ t: 'hi', pid: ctl.pid, name: ctl.name }); });
    conn.on('data', onHostMsg);
    conn.on('close', () => { if (ctl.conn === conn) lostHost(); });
    conn.on('error', () => { if (ctl.conn === conn) lostHost(); });
  };
  if (ctl.peer && !ctl.peer.destroyed && ctl.peer.open) { open(); return; }
  try { if (ctl.peer) ctl.peer.destroy(); } catch (e) {}
  ctl.peer = new Peer(peerOpts());
  ctl.peer.on('open', open);
  ctl.peer.on('error', e => {
    if (e.type === 'peer-unavailable') {
      if (ctl.joined) { lostHost(); return; }
      $('#joinErr').textContent = 'No room called ' + ctl.code + '. Check the code on the TV.'; $('#joinGo').disabled = false;
    } else if (!ctl.joined) { $('#joinErr').textContent = 'Could not connect (' + e.type + '). Try again.'; $('#joinGo').disabled = false; }
    else lostHost();
  });
  ctl.peer.on('disconnected', () => { try { ctl.peer.reconnect(); } catch (e) {} });
}
function lostHost() {
  if (!ctl.joined) { $('#joinErr').textContent = 'Connection lost. Try again.'; $('#joinGo').disabled = false; return; }
  banner('Reconnecting to the TV…');
  clearTimeout(ctl.retry); ctl.retry = setTimeout(ctlConnect, 1500);
}
function banner(m) { const b = $('#netBanner'); if (m) { b.textContent = m; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function onHostMsg(d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'full') { $('#joinErr').textContent = 'That room is full (4 players).'; $('#joinGo').disabled = false; return; }
  if (d.t === 'wait') { enterPad(); showMsg('<b>Game in progress</b>You will join when this round ends.'); return; }
  if (d.t === 'buzz') { try { navigator.vibrate && navigator.vibrate(d.ms); } catch (e) {} return; }
  if (d.t === 'ph') { enterPad(); ctl.info = d; renderPad(); }
}
function enterPad() {
  if (!ctl.joined) { ctl.joined = true; $('#joinForm').classList.add('hidden'); $('#joinGo').disabled = false; $('#joinErr').textContent = ''; }
  banner('');
}
function showMsg(html) { const m = $('#padMsg'); if (html) { m.innerHTML = html; m.classList.remove('hidden'); } else m.classList.add('hidden'); }
function renderPad() {
  const d = ctl.info; if (!d) return;
  $('#chip').style.background = d.color; $('#pname').textContent = d.name; $('#pname').style.color = d.color;
  $('#pad').style.background = `linear-gradient(160deg, ${d.color}33, #1b1838 55%)`;
  $('#aBtn').style.background = d.color;
  $('#aBtn').innerHTML = 'A<small>' + (d.button || 'ACTION') + '</small>';
  let hint = '';
  if (d.phase === 'lobby') {
    hint = 'In the lobby';
    showMsg(`<b>You're in! 🎉</b>${d.leader ? 'You are the leader. Start when everyone has joined.' : 'Waiting for the leader to start…'}` +
      (d.leader ? '<br><button id="startBtn">Start game ▶</button>' : ''));
    if (d.leader) $('#startBtn').onclick = () => ctlSend({ t: 'cmd', c: 'start' });
  } else if (d.phase === 'intro') { hint = d.title; showMsg(`<b>${d.title}</b>${d.how}`); }
  else if (d.phase === 'play') { hint = d.title + ' · Go!'; showMsg(''); }
  else if (d.phase === 'results') { hint = 'Results'; showMsg('<b>Look at the TV 📺</b>' + (d.leader ? '<button id="startBtn">Skip ▶</button>' : '')); if (d.leader) $('#startBtn').onclick = () => ctlSend({ t: 'cmd', c: 'skip' }); }
  else if (d.phase === 'podium') { hint = 'Cup over'; showMsg('<b>Cup over! 🏆</b>Check the podium on the TV.' + (d.leader ? '<br><button id="startBtn">Back to lobby ▶</button>' : '')); if (d.leader) $('#startBtn').onclick = () => ctlSend({ t: 'cmd', c: 'skip' }); }
  $('#phint').textContent = hint;
}
function ctlSend(m) { if (ctl.conn && ctl.conn.open) { try { ctl.conn.send(m); } catch (e) {} } }
function ctlSendInput() {
  if (!ctl.joined) return;
  const i = ctl.input, x = Math.round(i.x * 100) / 100, y = Math.round(i.y * 100) / 100;
  const key = x + ',' + y + ',' + (i.a ? 1 : 0), now = performance.now();
  if (key !== ctl.lastSent || now - ctl.lastT > 200) { ctlSend({ t: 'in', x, y, a: i.a }); ctl.lastSent = key; ctl.lastT = now; }

function setupPadInput() {
  const zone = $('#stickZone'), base = $('#stickBase'), knob = $('#stickKnob'), help = $('#stickHelp'), RAD = 62;
  let sid = null, ox = 0, oy = 0;
  const place = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; };
  zone.addEventListener('pointerdown', e => {
    if (sid !== null) return; sid = e.pointerId; try { zone.setPointerCapture(sid); } catch (x) {}
    const r = zone.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top;
    place(base, ox, oy); place(knob, ox, oy); base.classList.remove('hidden'); knob.classList.remove('hidden'); help.classList.add('hidden');
    e.preventDefault();
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== sid) return;
    const r = zone.getBoundingClientRect(); let dx = e.clientX - r.left - ox, dy = e.clientY - r.top - oy;
    const d = hyp(dx, dy); if (d > RAD) { dx *= RAD / d; dy *= RAD / d; }
    place(knob, ox + dx, oy + dy);
    let x = dx / RAD, y = dy / RAD; const m = hyp(x, y);
    if (m < 0.15) { x = 0; y = 0; } else { const s = Math.min(1, (m - 0.15) / 0.75) / m; x *= s; y *= s; }
    ctl.input.x = x; ctl.input.y = y; e.preventDefault();
  });
  const end = e => { if (e.pointerId !== sid) return; sid = null; ctl.input.x = ctl.input.y = 0; base.classList.add('hidden'); knob.classList.add('hidden'); };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  const btn = $('#aBtn'); let bid = null;
  const bdown = e => { bid = e.pointerId; try { btn.setPointerCapture(bid); } catch (x) {} ctl.input.a = true; btn.classList.add('down'); ctlSendInput(); try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} e.preventDefault(); };
  const bup = e => { if (e.pointerId !== bid) return; bid = null; ctl.input.a = false; btn.classList.remove('down'); ctlSendInput(); };
  btn.addEventListener('pointerdown', bdown); btn.addEventListener('pointerup', bup); btn.addEventListener('pointercancel', bup);
  // the whole right half acts as the button too, for big thumbs
  $('#btnZone').addEventListener('pointerdown', e => { if (e.target === $('#btnZone')) bdown(e); });
  $('#btnZone').addEventListener('pointerup', bup); $('#btnZone').addEventListener('pointercancel', bup);
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
}
