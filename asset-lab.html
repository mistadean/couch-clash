<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troll Toll · Asset Lab (Section A)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#141833;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;color:#fff}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  canvas{position:absolute;inset:0;width:100%;height:100%}

  #panel{position:fixed;right:10px;top:54px;bottom:10px;width:360px;background:rgba(20,24,51,.94);border-radius:14px;padding:12px 14px;overflow:auto;font-size:12.5px;display:none;z-index:6}
  #panel h3{margin:0 0 6px;font-size:15px}

  #load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px}
</style></head><body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas></div></div>
<div id="load">Loading art…</div>
<div id="bar">
  <button id="bD">Debug view</button><button id="bP">Asset list</button><button id="bQ">Quality: @2x</button>
  <button id="bM" class="on">Animation</button><button id="bG">Export layout guide</button>
</div>
<div id="panel"></div>
<div id="drop">Drop PNG or WebP files named as in the spec</div>
<script>
// =====================================================================
// Troll Toll asset lab. Geometry below is copied unchanged from the
// Stage B prototype: art is fitted to it, never the other way round.
// =====================================================================
const W = 1280, H = 720, BASE = 'assets/troll-toll/';
const qs = new URLSearchParams(location.search);
let DENS = qs.get('q') === '1x' ? 1 : 2, DEBUG = qs.has('debug'), ANIM = true;

// ---------- geometry (Stage B) ----------
function spline(P, step = 2) {
  const out = []; const Q = [P[0], ...P, P[P.length - 1]];
  for (let i = 1; i < Q.length - 2; i++) { const [p0, p1, p2, p3] = [Q[i - 1], Q[i], Q[i + 1], Q[i + 2]]; const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), n = Math.max(2, Math.ceil(L / step));
    for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; out.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } }
  out.push(P[P.length - 1]); let d = 0; out[0][2] = 0; for (let i = 1; i < out.length; i++) { d += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]); out[i][2] = d; } return out;
}
function at(C, s) { let i = 1; while (i < C.length - 1 && C[i][2] < s) i++; const a = C[i - 1], b = C[i], u = (s - a[2]) / ((b[2] - a[2]) || 1), x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u, dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return { x, y, nx: -dy / l, ny: dx / l }; }
const nearD = (C, x, y) => { let d = 1e9; for (let i = 0; i < C.length; i += 3) d = Math.min(d, Math.hypot(C[i][0] - x, C[i][1] - y)); return d; };
const KC = [285, 400], KRX = 222, KRY = 120, PLAZA = [726, 412], SHRINE = [992, 258];
const ROAD1 = spline([[492, 404], [560, 420], [628, 424], [690, 414]]);
const ROAD2 = spline([[762, 408], [830, 404], [888, 402], [930, 398], [982, 382], [1020, 352], [972, 322], [992, 288]]);
const LAVA = spline([[1090, 98], [1118, 170], [1106, 250], [1046, 320], [966, 372], [890, 430], [838, 520], [806, 620], [796, 700]]);
const HW = 19, TL = 46, GAP = 5.5, BED = 54;            // space half-width, length, joint; painted bed width
const ash = x => Math.max(0, Math.min(1, (x - 760) / 170));
let BRS = 0; { let bd = 1e9; for (const p of ROAD2) { const d = nearD(LAVA, p[0], p[1]); if (d < bd) { bd = d; BRS = p[2]; } } }
const BRP = at(ROAD2, BRS);
// movement spaces, exactly as the prototype lays them
const SPACES = [];
function laySpaces(C, types, bridgeAt) { const L = C[C.length - 1][2], n = Math.max(1, Math.round(L / TL)), tl = L / n;
  for (let i = 0; i < n; i++) { const s0 = i * tl + GAP / 2, s1 = (i + 1) * tl - GAP / 2, k = 0.86, P = [];
    for (let j = 0; j <= 4; j++) { const p = at(C, s0 + (s1 - s0) * j / 4); P.push([p.x + p.nx * HW * k, p.y + p.ny * HW * k]); }
    for (let j = 4; j >= 0; j--) { const p = at(C, s0 + (s1 - s0) * j / 4); P.push([p.x - p.nx * HW * k, p.y - p.ny * HW * k]); }
    const m = at(C, (s0 + s1) / 2); SPACES.push({ P, x: m.x, y: m.y, type: bridgeAt === i ? 'bridge' : types[i] || 'road', a: ash(m.x) }); } }
laySpaces(ROAD1, ['road', 'gold', 'road', 'heal', 'road']);
laySpaces(ROAD2, ['road', 'hex', 'road', 'road', 'danger', 'road', 'ability', 'danger', 'road', 'hex', 'road'], Math.floor(BRS / (ROAD2[ROAD2.length - 1][2] / Math.round(ROAD2[ROAD2.length - 1][2] / TL))));
const PLINTHS = []; for (let i = 0; i < 8; i++) { const a = Math.PI * (1.08 + 0.84 * i / 7); PLINTHS.push([Math.round(KC[0] + Math.cos(a) * 128), Math.round(KC[1] + 22 + Math.sin(a) * 58)]); }

// ---------- default manifest (a manifest.json next to the art overrides it) ----------
// layer: flat (baked) | objects (depth-sorted) ; at = anchor in world units ; anchor = point in image (0-1) ; w,h = size in world units (h only for placeholders)
let MANIFEST = { section: 'a', frame: [W, H], density: 2, assets: [
  { id: 'a_ground_plate', layer: 'ground', at: [0, 0], anchor: [0, 0], w: 1280, h: 720 },
  { id: 'a_kingdom_plateau', layer: 'flat', at: [285, 400], anchor: [0.5, 0.4], w: 470, h: 290 },
  { id: 'a_kingdom_court', layer: 'flat', at: [285, 422], anchor: [0.5, 0.5], w: 330, h: 160 },
  { id: 'a_volcano_cone', layer: 'flat', at: [1080, 380], anchor: [0.5, 0.97], w: 440, h: 330 },
  { id: 'a_volcano_shrine', layer: 'flat', at: [992, 262], anchor: [0.5, 0.55], w: 104, h: 70 },
  { id: 'a_lava_bridge', layer: 'flat', at: [Math.round(BRP.x), Math.round(BRP.y + 6)], anchor: [0.5, 0.35], w: 84, h: 52 },
  { id: 'a_kingdom_backwall', layer: 'objects', at: [285, 384], anchor: [0.5, 0.95], w: 450, h: 190, sortY: 300 },
  { id: 'a_kingdom_keep', layer: 'objects', at: [285, 344], anchor: [0.5, 0.96], w: 210, h: 280, shadow: [96, 18] },
  { id: 'a_kingdom_gatehouse', layer: 'objects', at: [486, 402], anchor: [0.5, 0.96], w: 50, h: 102, shadow: [24, 7] },
  { id: 'a_kingdom_plinth', layer: 'objects', ats: PLINTHS, anchor: [0.5, 0.95], w: 32, h: 46, shadow: [16, 6], tint: true },
  { id: 'a_bridgehouse', layer: 'objects', at: [726, 392], anchor: [0.5, 0.95], w: 124, h: 104, shadow: [58, 12] },
  { id: 'a_dragon_egg', layer: 'objects', at: [992, 236], anchor: [0.5, 0.95], w: 30, h: 38, anim: { bob: 3 } },
  { id: 'shared_troll_body', layer: 'objects', at: [Math.round(BRP.x - 30), Math.round(BRP.y + 52)], anchor: [0.5, 0.95], w: 46, h: 44, shadow: [20, 5], anim: { bob: 3 } },
  { id: 'shared_troll_arm', layer: 'objects', parent: 'shared_troll_body', offset: [14, -16], pivot: [0.2, 0.75], w: 30, h: 34, anim: { swing: 14 } },
  { id: 'shared_tree_meadow_01', layer: 'objects', ats: [[96, 210], [150, 590], [600, 300], [580, 326], [628, 318], [96, 560], [70, 600], [636, 628], [430, 600]], anchor: [0.5, 0.96], w: 48, h: 62, shadow: [16, 5] },
  { id: 'shared_tree_meadow_02', layer: 'objects', ats: [[40, 300], [130, 586], [520, 160], [660, 200], [600, 610], [60, 450], [700, 520], [520, 560]], anchor: [0.5, 0.96], w: 46, h: 60, shadow: [16, 5] },
  { id: 'shared_tree_dead_01', layer: 'objects', ats: [[900, 520], [1000, 520], [1210, 420], [1150, 560], [1225, 640]], anchor: [0.5, 0.96], w: 36, h: 44, shadow: [11, 4] },
  { id: 'shared_rock_basalt_01', layer: 'objects', ats: [[975, 460], [1170, 410], [1100, 550], [935, 600], [1260, 540]], anchor: [0.5, 0.9], w: 30, h: 20, shadow: [12, 4] },
  { id: 'shared_space_stone', layer: 'texture', w: 128, h: 128 },
  { id: 'shared_space_basalt', layer: 'texture', w: 128, h: 128 },
  { id: 'shared_space_planks', layer: 'texture', w: 128, h: 128 },
  { id: 'a_lava_flow', layer: 'texture', w: 128, h: 16 },
  { id: 'shared_fx_smoke_8f', layer: 'fx', emit: [[1086, 92, 1.4], [752, 306, 0.5]], frames: 8, w: 40, h: 40 },
  { id: 'a_sign_board', layer: 'signs', ats: [[285, 550, 'THE KINGDOM'], [726, 458, 'EMBER BRIDGEHOUSE'], [1150, 300, 'DRAGON VOLCANO']], anchor: [0.5, 0.5], w: 200, h: 34 },
  ...['heal', 'gold', 'hex', 'ability', 'danger'].map(k => ({ id: 'shared_inlay_' + k, layer: 'inlay', w: 24, h: 24 })),
] };

// ---------- loading, magenta keying, checks ----------
const ART = {};                       // id -> { img, src, w, h, issues[] }
const scopeOf = id => id.startsWith('shared_') ? 'shared/' : id.split('_')[0] + '/';
function loadImg(url) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; }); }
function prep(im, id, src) { // key out a flat magenta background and check the file against the spec
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const issues = []; let keyed = false; const spec = MANIFEST.assets.find(a => a.id === id) || {};
  const opaqueOk = spec.layer === 'ground' || spec.layer === 'texture';
  const d = x.getImageData(0, 0, c.width, c.height), D = d.data, px = (i, j) => (j * c.width + i) * 4;
  const c0 = px(0, 0), isMag = D[c0] > 230 && D[c0 + 1] < 40 && D[c0 + 2] > 230 && D[c0 + 3] > 250;
  if (isMag && !opaqueOk) { for (let i = 0; i < D.length; i += 4) { const r = D[i], g = D[i + 1], b = D[i + 2], m = Math.min(r, b) - g; if (m > 150) D[i + 3] = 0; else if (m > 70) { D[i + 3] = Math.round(D[i + 3] * (150 - m) / 80); D[i] = Math.min(r, g + 60); D[i + 2] = Math.min(b, g + 60); } } x.putImageData(d, 0, 0); keyed = true; }
  if (!opaqueOk && !keyed) { let edge = 0, n = 0; for (let i = 0; i < c.width; i += 4) { for (const j of [0, c.height - 1]) { n++; if (D[px(i, j) + 3] > 20) edge++; } } if (edge / n > 0.2) issues.push('no transparent background'); }
  if (spec.w && !opaqueOk && c.width < spec.w * 2 * 0.85) issues.push(`small: ${c.width}px wide, spec ~${spec.w * 2}px`);
  if (keyed) issues.push('magenta keyed out');
  return { img: c, src, w: c.width, h: c.height, issues };
}
async function loadAll() {
  const mf = await fetch(BASE + 'a/manifest.json').then(r => r.ok ? r.json() : null).catch(() => null); if (mf && mf.assets) MANIFEST = mf;
  await Promise.all(MANIFEST.assets.map(async a => { if (ART[a.id] && ART[a.id].src === 'dropped') return;
    const base = BASE + scopeOf(a.id) + a.id + (DENS === 1 ? '@1x' : '');
    let im = null, src = ''; for (const ext of ['.webp', '.png']) { im = await loadImg(base + ext); if (im) { src = base + ext; break; } if (DENS === 1) { im = await loadImg(BASE + scopeOf(a.id) + a.id + ext); if (im) { src = a.id + ext; break; } } }
    if (im) { try { await im.decode(); } catch (e) {} ART[a.id] = prep(im, a.id, src); } else delete ART[a.id]; }));
  bake(); renderPanel(); document.getElementById('load').style.display = 'none';
}

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1; function resize() { const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); SC = cv.width / W; }
addEventListener('resize', () => { resize(); });
resize();
const INK = '#3b2a20';

// placeholder for a missing file: dashed box at the right size and anchor, named
function placeholder(x, a, cx, cy, w, h) { const ax = (a.anchor || [0.5, 1])[0], ay = (a.anchor || [0.5, 1])[1], x0 = cx - ax * w, y0 = cy - ay * h;
  x.save(); x.fillStyle = 'rgba(255,198,26,.10)'; x.strokeStyle = 'rgba(255,170,40,.9)'; x.setLineDash([6, 4]); x.lineWidth = 1.5; x.beginPath(); x.roundRect(x0, y0, w, h, 6); x.fill(); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#7a4a10'; x.font = `600 ${Math.max(7, Math.min(13, w / 12))}px Fredoka,system-ui`; x.textAlign = 'center'; x.fillText(a.id, cx - ax * w + w / 2, y0 + h / 2 + 4); x.restore(); }
function sprite(x, a, cx, cy, extra = {}) { const art = ART[a.id], w = a.w, h = art ? w * art.h / art.w : a.h, ax = (a.anchor || [0.5, 1])[0], ay = (a.anchor || [0.5, 1])[1];
  if (a.shadow) { x.fillStyle = 'rgba(30,20,10,.22)'; x.beginPath(); x.ellipse(cx, cy, a.shadow[0], a.shadow[1], 0, 0, Math.PI * 2); x.fill(); }
  if (!art) { placeholder(x, a, cx, cy, w, h); return { x0: cx - ax * w, y0: cy - ay * h, w, h }; }
  x.drawImage(art.img, cx - ax * w, cy - ay * h, w, h); return { x0: cx - ax * w, y0: cy - ay * h, w, h }; }

// ---------- procedural fallback ground (used only until a_ground_plate arrives) ----------
function fallbackGround(x) { const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#8fd06a'); g.addColorStop(.52, '#9ccf62'); g.addColorStop(.66, '#b9a46a'); g.addColorStop(.78, '#7a5f50'); g.addColorStop(1, '#5b453f');
  const s = x.createLinearGradient(0, 0, 0, 160); s.addColorStop(0, '#7fc4f0'); s.addColorStop(1, '#cdeefc'); x.fillStyle = s; x.fillRect(0, 0, W, H);
  x.fillStyle = g; x.beginPath(); x.moveTo(0, 150); x.bezierCurveTo(400, 120, 900, 120, W, 150); x.lineTo(W, 650); x.bezierCurveTo(900, 690, 400, 680, 0, 690); x.closePath(); x.fill();
  x.fillStyle = '#7d5f45'; x.beginPath(); x.moveTo(0, 690); x.bezierCurveTo(400, 680, 900, 690, W, 650); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  for (const C of [ROAD1, ROAD2]) { x.strokeStyle = '#b9925f'; x.lineWidth = BED; x.lineCap = x.lineJoin = 'round'; x.beginPath(); C.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); }
  x.fillStyle = '#e3d4b6'; x.beginPath(); x.ellipse(PLAZA[0], PLAZA[1], 40, 18, 0, 0, Math.PI * 2); x.fill(); }

// ---------- bake layers 1-3 into one image ----------
let BAKED = null;
function bake() { BAKED = document.createElement('canvas'); BAKED.width = W * DENS; BAKED.height = H * DENS; const x = BAKED.getContext('2d'); x.scale(DENS, DENS);
  const g = MANIFEST.assets.find(a => a.layer === 'ground'); if (g && ART[g.id]) x.drawImage(ART[g.id].img, 0, 0, W, H); else fallbackGround(x);
  for (const a of MANIFEST.assets.filter(a => a.layer === 'flat')) sprite(x, a, a.at[0], a.at[1]);
  PAT = {}; for (const k of ['shared_space_stone', 'shared_space_basalt', 'shared_space_planks', 'a_lava_flow']) if (ART[k]) PAT[k] = ctx.createPattern(ART[k].img, 'repeat'); }
let PAT = {};

// ---------- movement spaces (engine-drawn) ----------
const INL = { heal: '#ff6f91', gold: '#f2a81e', hex: '#d8344a', ability: '#8f5cf5', move: '#3aa6e8', danger: '#e2541c' };
function poly(x, P, dy = 0) { x.beginPath(); P.forEach((p, i) => i ? x.lineTo(p[0], p[1] + dy) : x.moveTo(p[0], p[1] + dy)); x.closePath(); }
function drawSpaces(x, t) {
  for (const s of SPACES) { poly(x, s.P, 2.5); x.fillStyle = 'rgba(0,0,0,.22)'; x.fill();
    const key = s.type === 'bridge' ? 'shared_space_planks' : s.a > 0.6 ? 'shared_space_basalt' : 'shared_space_stone';
    poly(x, s.P); if (PAT[key]) { PAT[key].setTransform(new DOMMatrix().scale(0.5)); x.fillStyle = PAT[key]; x.fill(); if (s.a > 0.25 && s.a <= 0.6) { x.fillStyle = 'rgba(160,120,80,.35)'; x.fill(); } }
    else { x.fillStyle = s.type === 'bridge' ? '#9a6a3e' : s.a > 0.6 ? '#4d3d38' : s.a > 0.25 ? '#c9b48e' : '#efe3c9'; x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,' + (s.a > .6 ? .12 : .45) + ')'; x.lineWidth = 1.4; x.beginPath(); s.P.slice(0, 5).forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke();
    if (INL[s.type]) { const art = ART['shared_inlay_' + s.type]; if (art) x.drawImage(art.img, s.x - 12, s.y - 9.5, 24, 19);
      else { x.fillStyle = INL[s.type]; x.strokeStyle = INK; x.lineWidth = 1.8; x.beginPath(); x.ellipse(s.x, s.y, 11.5, 9, 0, 0, Math.PI * 2); x.fill(); x.stroke(); x.fillStyle = '#fff'; x.font = '700 10px Fredoka'; x.textAlign = 'center'; x.fillText({ heal: '♥', gold: '¢', hex: '✦', ability: '★', danger: '!' }[s.type], s.x, s.y + 3.5); } } }
}

// ---------- pawns walking the road (shows depth sorting and outlines) ----------
const ROUTE = [[KC[0], KC[1] + 46], ...SPACES.map(s => [s.x, s.y])];
const PAWNS = [{ col: '#ff4d6d', ch: 'D', i: 0, t: 0 }, { col: '#3d8bff', ch: 'G', i: 9, t: 0.5 }];
function pawnPos(p) { const a = ROUTE[p.i], b = ROUTE[Math.min(ROUTE.length - 1, p.i + 1)], u = Math.min(1, p.t); return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u - Math.sin(u * Math.PI) * 9]; }
function drawPawn(x, px, py, col, ch, outline) { x.save(); x.translate(px, py);
  if (outline) { x.globalAlpha = .9; x.strokeStyle = col; x.lineWidth = 2.5; x.setLineDash([4, 3]); x.beginPath(); x.moveTo(-11, 0); x.bezierCurveTo(-12, -8, -8, -14, -6, -16); x.lineTo(6, -16); x.bezierCurveTo(8, -14, 12, -8, 11, 0); x.closePath(); x.stroke(); x.beginPath(); x.arc(0, -24, 11, 0, Math.PI * 2); x.stroke(); x.restore(); return; }
  x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(0, 2, 13, 5, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = col; x.strokeStyle = INK; x.lineWidth = 2.4; x.beginPath(); x.moveTo(-11, 0); x.bezierCurveTo(-12, -8, -8, -14, -6, -16); x.lineTo(6, -16); x.bezierCurveTo(8, -14, 12, -8, 11, 0); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.arc(0, -24, 11, 0, Math.PI * 2); x.fill(); x.stroke(); x.fillStyle = '#fff'; x.beginPath(); x.arc(0, -24, 7.5, 0, Math.PI * 2); x.fill();
  x.fillStyle = INK; x.font = '700 10px Fredoka'; x.textAlign = 'center'; x.fillText(ch, 0, -20.5); x.restore(); }

// ---------- effects ----------
const PARTS = [];
function fx(x, dt, t) {
  // lava: body + flowing highlight (texture strip if supplied)
  const path = () => { x.beginPath(); LAVA.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); };
  x.lineCap = x.lineJoin = 'round';
  x.globalAlpha = .22 + .08 * Math.sin(t * 2.6); path(); x.strokeStyle = '#ff7a1a'; x.lineWidth = 34; x.stroke(); x.globalAlpha = 1;
  path(); x.strokeStyle = '#4a2a1e'; x.lineWidth = 22; x.stroke(); path(); x.strokeStyle = '#ff6a1a'; x.lineWidth = 16; x.stroke();
  if (PAT.a_lava_flow) { PAT.a_lava_flow.setTransform(new DOMMatrix().translate(0, -t * 30).scale(0.5)); path(); x.strokeStyle = PAT.a_lava_flow; x.lineWidth = 14; x.stroke(); }
  else { path(); x.setLineDash([26, 14]); x.lineDashOffset = -t * 37; x.strokeStyle = '#ffd23f'; x.lineWidth = 6; x.stroke(); x.setLineDash([]); }

  x.save(); x.globalCompositeOperation = 'lighter'; const gr = x.createRadialGradient(1086, 95, 2, 1086, 95, 46); gr.addColorStop(0, 'rgba(255,220,120,.9)'); gr.addColorStop(1, 'rgba(255,90,20,0)'); x.globalAlpha = .7 + .3 * Math.sin(t * 2.4); x.fillStyle = gr; x.beginPath(); x.ellipse(1086, 95, 46, 14, 0, 0, Math.PI * 2); x.fill(); x.restore();
}
function airFx(x, dt, t) { const sm = MANIFEST.assets.find(a => a.layer === 'fx'), art = sm && ART[sm.id];
  if (sm && ANIM) for (const [ex, ey, rate] of sm.emit) if (Math.random() < rate * dt * 2 && PARTS.length < (DENS === 1 ? 30 : 80)) PARTS.push({ x: ex + Math.random() * 10 - 5, y: ey, vx: -8 - Math.random() * 10, vy: -26 - Math.random() * 10, life: 0, max: 5 + Math.random() * 2, s: rate > 1 ? 1 : 0.5 });
  if (ANIM && Math.random() < dt * 6) { const p = at(LAVA, Math.random() * LAVA[LAVA.length - 1][2]); PARTS.push({ x: p.x, y: p.y, vx: Math.random() * 10 - 5, vy: -30, life: 0, max: 2.5, ember: 1 }); }
  for (let i = PARTS.length - 1; i >= 0; i--) { const p = PARTS[i]; p.life += dt; if (p.life > p.max) { PARTS.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; const u = p.life / p.max;
    if (p.ember) { x.globalAlpha = 1 - u; x.fillStyle = '#ffd23f'; x.beginPath(); x.arc(p.x, p.y, 1.8, 0, Math.PI * 2); x.fill(); continue; }
    const sz = sm.w * p.s * (0.5 + u * 1.4); x.globalAlpha = Math.min(1, u * 6) * (1 - u) * 0.85;
    if (art) { const f = Math.min(sm.frames - 1, Math.floor(u * sm.frames)), fw = art.w / sm.frames; x.drawImage(art.img, f * fw, 0, fw, art.h, p.x - sz / 2, p.y - sz / 2, sz, sz); }
    else { x.fillStyle = '#8f8683'; x.beginPath(); x.arc(p.x, p.y, sz / 2.4, 0, Math.PI * 2); x.fill(); } }
  x.globalAlpha = 1; }
function signs(x) { const a = MANIFEST.assets.find(a => a.layer === 'signs'); if (!a) return;
  for (const [sx, sy, txt] of a.ats) { if (ART[a.id]) sprite(x, a, sx, sy); else { x.fillStyle = '#5b3d26'; x.fillRect(sx - a.w / 2 + 12, sy + 10, 4, 12); x.fillRect(sx + a.w / 2 - 16, sy + 10, 4, 12); x.fillStyle = '#7a5034'; x.strokeStyle = INK; x.lineWidth = 2.5; x.beginPath(); x.roundRect(sx - a.w / 2, sy - 14, a.w, 28, 8); x.fill(); x.stroke(); }
    x.fillStyle = '#fff4dc'; x.font = '700 16px Fredoka'; x.textAlign = 'center'; x.fillText(txt, sx, sy + 6); } }

// ---------- frame ----------
let last = performance.now(), T = 0, fpsA = 60, draws = 0;
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (ANIM) T += dt; fpsA += ((1 / Math.max(dt, 1e-3)) - fpsA) * 0.05;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#141833'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.setTransform(SC, 0, 0, SC, 0, 0); draws = 0;
  if (BAKED) { ctx.drawImage(BAKED, 0, 0, W, H); draws++; }
  fx(ctx, dt, T); drawSpaces(ctx, T); draws += SPACES.length;
  // depth-sorted objects
  const items = [];
  for (const a of MANIFEST.assets.filter(a => a.layer === 'objects' && !a.parent)) { const list = a.ats || [a.at];
    list.forEach((p, k) => { let cy = p[1]; const bob = a.anim && a.anim.bob && ANIM ? Math.sin(T * 2.2 + k) * a.anim.bob : 0;
      items.push({ y: a.sortY ?? p[1], k: 'spr', draw: () => { const b = sprite(ctx, a, p[0], cy + (a.anim && a.anim.bob ? 0 : 0), {}); if (bob) {}
        if (a.tint && !ART[a.id]) {} if (a.tint) { ctx.fillStyle = ['#ff4d6d', '#3d8bff', '#ffc61a', '#3ccf6e', '#b06cff', '#ff8a1f', '#25d0c8', '#ff7ac8'][k]; ctx.globalAlpha = .9; ctx.fillRect(p[0] - a.w * .34, cy - a.h * .55, a.w * .68, a.h * .14); ctx.globalAlpha = 1; }
        for (const c of MANIFEST.assets.filter(c => c.parent === a.id)) { const art = ART[c.id], w = c.w, h = art ? w * art.h / art.w : c.h, ang = (c.anim && c.anim.swing && ANIM ? Math.sin(T * 2.6) * c.anim.swing : 0) * Math.PI / 180;
          ctx.save(); ctx.translate(p[0] + c.offset[0], cy + c.offset[1]); ctx.rotate(ang); if (art) ctx.drawImage(art.img, -c.pivot[0] * w, -c.pivot[1] * h, w, h); else placeholder(ctx, { ...c, anchor: c.pivot }, 0, 0, w, h); ctx.restore(); }
        return b; }, bob, a });
    }); }
  for (const p of PAWNS) { if (ANIM) { p.t += dt * 1.6; if (p.t >= 1.6) { p.t = 0; p.i = (p.i + 1) % (ROUTE.length - 1); } } const [px, py] = pawnPos(p); items.push({ y: ROUTE[Math.min(ROUTE.length - 1, p.i + (p.t > .5 ? 1 : 0))][1], k: 'pawn', p, px, py }); }
  items.sort((a, b) => a.y - b.y);

  for (const it of items) { if (it.k === 'pawn') { drawPawn(ctx, it.px, it.py, it.p.col, it.p.ch); it.after = boxes.length; } else { ctx.save(); if (it.bob) ctx.translate(0, it.bob); const b = it.draw(); ctx.restore(); boxes.push({ ...b, y: it.y }); } draws++; }
  // pawn outlines when art in front covers them
  for (const it of items.filter(i => i.k === 'pawn')) { const hid = boxes.slice(it.after).some(b => it.px > b.x0 && it.px < b.x0 + b.w && it.py - 20 > b.y0 && it.py - 20 < b.y0 + b.h && b.y > it.y); if (hid) drawPawn(ctx, it.px, it.py, it.p.col, it.p.ch, true); }
  airFx(ctx, dt, T); signs(ctx);
  if (DEBUG) debugDraw(ctx, boxes);
  requestAnimationFrame(frame); }

function debugDraw(x, boxes) {
  x.save(); x.lineWidth = 1;
  for (const C of [ROAD1, ROAD2]) { x.strokeStyle = 'rgba(0,255,255,.18)'; x.lineWidth = BED; x.lineCap = 'round'; x.beginPath(); C.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); }
  x.lineWidth = 1.2; x.strokeStyle = '#00e5ff'; for (const s of SPACES) { poly(x, s.P); x.stroke(); }
  x.strokeStyle = 'rgba(255,0,200,.8)'; for (const b of boxes) x.strokeRect(b.x0, b.y0, b.w, b.h);
  for (const a of MANIFEST.assets) for (const p of (a.ats || (a.at ? [a.at] : []))) { x.strokeStyle = '#ff00c8'; x.beginPath(); x.moveTo(p[0] - 6, p[1]); x.lineTo(p[0] + 6, p[1]); x.moveTo(p[0], p[1] - 6); x.lineTo(p[0], p[1] + 6); x.stroke(); }
  x.fillStyle = 'rgba(255,60,60,.18)'; x.fillRect(0, 0, 300, 100); x.fillRect(W - 360, 0, 360, 70); x.fillRect(0, H - 70, W, 70);
  x.fillStyle = '#fff'; x.font = '600 13px Fredoka'; x.textAlign = 'left'; x.fillText(`${Math.round(fpsA)} fps · ${draws} draws · @${DENS}x · ${Object.keys(ART).length}/${MANIFEST.assets.length} files · ${PARTS.length} particles`, 10, H - 80);
  x.restore(); }

// ---------- layout guide export (for painting the ground plate) ----------
function exportGuide() { const g = document.createElement('canvas'); g.width = W * 2; g.height = H * 2; const x = g.getContext('2d'); x.scale(2, 2);
  x.fillStyle = '#f4f1ea'; x.fillRect(0, 0, W, H); x.fillStyle = '#d7ecc8'; x.fillRect(0, 140, 760, 540); x.fillStyle = '#e3d6cf'; x.fillRect(760, 140, 520, 540);
  x.fillStyle = '#9a7b62'; x.fillRect(0, 680, W, 40); x.fillStyle = '#bfe3f7'; x.fillRect(0, 0, W, 140);
  x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#ff7a1a'; x.lineWidth = 26; x.beginPath(); LAVA.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke();

// ---------- asset panel + drag and drop ----------
function renderPanel() { const P = document.getElementById('panel');
  P.innerHTML = '<h3>Section A files</h3><div style="opacity:.75;margin-bottom:8px">Green = file loaded, amber = placeholder until supplied, blue = dropped in this session. Drop files onto the page to try them.</div>' +
    MANIFEST.assets.map(a => { const r = ART[a.id]; const st = !r ? '<span class="st ph">placeholder</span>' : r.src === 'dropped' ? '<span class="st drop">dropped</span>' : '<span class="st ok">loaded</span>';
      return `<div class="row">${st}<div><b>${a.id}</b>${r ? ` · ${r.w}×${r.h}px` : ''}${r && r.issues.length ? `<div class="bad">${r.issues.join(' · ')}</div>` : ''}</div></div>`; }).join(''); }
const dropEl = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.style.display = 'flex'; });
